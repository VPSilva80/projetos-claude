<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aquário 3D</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#02141f; }
  #tank { display:block; width:100vw; height:100vh; }

  /* reflexo do vidro e vinheta, por cima do 3D */
  #vidro {
    position:fixed; inset:0; pointer-events:none; z-index:2;
    background:
      linear-gradient(112deg, transparent 30%, rgba(200,240,255,.05) 33%, transparent 36%,
                              transparent 54%, rgba(200,240,255,.035) 56%, transparent 59%),
      radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(0,10,20,.55) 100%);
  }

  #carregando {
    position:fixed; inset:0; z-index:3; display:grid; place-items:center;
    background:#02141f; color:#7fd3ee; transition:opacity .6s;
    font:13px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing:.1em;
  }
  #carregando.pronto { opacity:0; pointer-events:none; }

  #painel {
    position:fixed; top:16px; right:16px; width:236px; padding:14px 16px 16px; z-index:4;
    border-radius:12px; background:rgba(4,22,34,.84);
    border:1px solid rgba(120,200,230,.22); box-shadow:0 12px 40px rgba(0,0,0,.5);
    backdrop-filter:blur(10px); color:#cfe9f4; display:none;
    font:12px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #painel.aberto { display:block; }
  #painel h2 { margin:0 0 12px; font-size:12px; font-weight:600; letter-spacing:.09em;
               text-transform:uppercase; color:#7fd3ee; }
  #painel label { display:block; margin-bottom:11px; }
  #painel .linha { display:flex; justify-content:space-between; margin-bottom:3px; color:#9fc4d4; }
  #painel input[type=range] { width:100%; accent-color:#4fc3e8; }
  #painel .check { display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  #painel .check input { accent-color:#4fc3e8; }
  #painel select { width:100%; padding:4px 6px; border-radius:6px; color:#cfe9f4;
                   border:1px solid rgba(120,200,230,.25); background:rgba(3,18,28,.9); font:inherit; }
  #painel footer { margin-top:12px; padding-top:10px; color:#6f92a3; font-size:11px;
                   border-top:1px solid rgba(120,200,230,.16); }
</style>
</head>
<body>
  <canvas id="tank"></canvas>
  <div id="vidro"></div>
  <div id="carregando">MONTANDO O AQUÁRIO…</div>

  <div id="painel">
    <h2>Aquário 3D</h2>
    <label>
      <span class="linha"><span>Peixes</span><b data-out="fishCount">18</b></span>
      <input type="range" id="fishCount" min="1" max="40" step="1" value="18">
    </label>
    <label>
      <span class="linha"><span>Velocidade</span><b data-out="speed">1.0</b></span>
      <input type="range" id="speed" min="0.2" max="2" step="0.1" value="1">
    </label>
    <label>
      <span class="linha"><span>Luz do sol</span><b data-out="light">1.0</b></span>
      <input type="range" id="light" min="0" max="2" step="0.1" value="1">
    </label>
    <label>
      <span class="linha"><span>Turvação da água</span><b data-out="murk">1.0</b></span>
      <input type="range" id="murk" min="0.2" max="2" step="0.1" value="1">
    </label>
    <label>
      <span class="linha"><span>Qualidade</span></span>
      <select id="quality">
        <option value="alta">Alta</option>
        <option value="media">Média</option>
        <option value="baixa">Baixa (economiza bateria)</option>
      </select>
    </label>
    <div class="check"><input type="checkbox" id="som"><span>Som de fundo do mar</span></div>
    <div class="check"><input type="checkbox" id="rays" checked><span>Raios de sol</span></div>
    <footer><b>S</b> painel · <b>M</b> liga/desliga som · <b>clique</b> chama os peixes</footer>
  </div>

  <script type="module" src="aquarium3d.js"></script>
</body>
</html>
