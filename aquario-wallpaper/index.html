<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aquário — Wallpaper Animado</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #041420;
    cursor: default;
  }
  #tank {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  /* Painel de ajustes — some por padrao, aparece com a tecla S */
  #painel {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 232px;
    padding: 14px 16px 16px;
    border-radius: 12px;
    background: rgba(6, 26, 38, .82);
    border: 1px solid rgba(120, 200, 230, .22);
    box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
    backdrop-filter: blur(10px);
    color: #cfe9f4;
    font: 12px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: none;
    z-index: 10;
  }
  #painel.aberto { display: block; }
  #painel h2 {
    margin: 0 0 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #7fd3ee;
  }
  #painel label {
    display: block;
    margin-bottom: 11px;
  }
  #painel .linha {
    display: flex;
    justify-content: space-between;
    margin-bottom: 3px;
    color: #9fc4d4;
  }
  #painel input[type=range] {
    width: 100%;
    accent-color: #4fc3e8;
  }
  #painel select {
    width: 100%;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid rgba(120, 200, 230, .25);
    background: rgba(4, 20, 32, .9);
    color: #cfe9f4;
    font: inherit;
  }
  #painel .check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 9px;
  }
  #painel .check input { accent-color: #4fc3e8; }
  #painel footer {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(120, 200, 230, .16);
    color: #6f92a3;
    font-size: 11px;
  }
</style>
</head>
<body>
  <canvas id="tank"></canvas>

  <div id="painel">
    <h2>Aquário</h2>
    <label>
      <span class="linha"><span>Peixes</span><b data-out="fishCount">14</b></span>
      <input type="range" id="fishCount" min="1" max="30" step="1" value="14">
    </label>
    <label>
      <span class="linha"><span>Velocidade</span><b data-out="speed">1.0</b></span>
      <input type="range" id="speed" min="0.2" max="2" step="0.1" value="1">
    </label>
    <label>
      <span class="linha"><span>Luz</span><b data-out="light">1.0</b></span>
      <input type="range" id="light" min="0" max="2" step="0.1" value="1">
    </label>
    <label>
      <span class="linha"><span>Cenário</span></span>
      <select id="theme">
        <option value="reef">Recife</option>
        <option value="deep">Águas fundas</option>
        <option value="lagoon">Lagoa</option>
      </select>
    </label>
    <div class="check"><input type="checkbox" id="bubbles" checked><span>Bolhas</span></div>
    <div class="check"><input type="checkbox" id="plants" checked><span>Plantas</span></div>
    <div class="check"><input type="checkbox" id="glass" checked><span>Reflexo do vidro</span></div>
    <footer>
      <b>S</b> abre/fecha · <b>clique</b> alimenta os peixes
    </footer>
  </div>

  <script src="aquarium.js"></script>
</body>
</html>
