<title>Aquário — Wallpaper Animado</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #041420;
    cursor: default;
  }
  #tank {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  /* Painel de ajustes — some por padrao, aparece com a tecla S */
  #painel {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 232px;
    padding: 14px 16px 16px;
    border-radius: 12px;
    background: rgba(6, 26, 38, .82);
    border: 1px solid rgba(120, 200, 230, .22);
    box-shadow: 0 12px 40px rgba(0, 0, 0, .45);
    backdrop-filter: blur(10px);
    color: #cfe9f4;
    font: 12px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: none;
    z-index: 10;
  }
  #painel.aberto { display: block; }
  #painel h2 {
    margin: 0 0 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #7fd3ee;
  }
  #painel label {
    display: block;
    margin-bottom: 11px;
  }
  #painel .linha {
    display: flex;
    justify-content: space-between;
    margin-bottom: 3px;
    color: #9fc4d4;
  }
  #painel input[type=range] {
    width: 100%;
    accent-color: #4fc3e8;
  }
  #painel select {
    width: 100%;
    padding: 4px 6px;
    border-radius: 6px;
    border: 1px solid rgba(120, 200, 230, .25);
    background: rgba(4, 20, 32, .9);
    color: #cfe9f4;
    font: inherit;
  }
  #painel .check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 9px;
  }
  #painel .check input { accent-color: #4fc3e8; }
  #painel footer {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid rgba(120, 200, 230, .16);
    color: #6f92a3;
    font-size: 11px;
  }
</style>
<canvas id="tank"></canvas>

  <div id="painel">
    <h2>Aquário</h2>
    <label>
      <span class="linha"><span>Peixes</span><b data-out="fishCount">14</b></span>
      <input type="range" id="fishCount" min="1" max="30" step="1" value="14">
    </label>
    <label>
      <span class="linha"><span>Velocidade</span><b data-out="speed">1.0</b></span>
      <input type="range" id="speed" min="0.2" max="2" step="0.1" value="1">
    </label>
    <label>
      <span class="linha"><span>Luz</span><b data-out="light">1.0</b></span>
      <input type="range" id="light" min="0" max="2" step="0.1" value="1">
    </label>
    <label>
      <span class="linha"><span>Cenário</span></span>
      <select id="theme">
        <option value="reef">Recife</option>
        <option value="deep">Águas fundas</option>
        <option value="lagoon">Lagoa</option>
      </select>
    </label>
    <div class="check"><input type="checkbox" id="bubbles" checked><span>Bolhas</span></div>
    <div class="check"><input type="checkbox" id="plants" checked><span>Plantas</span></div>
    <div class="check"><input type="checkbox" id="glass" checked><span>Reflexo do vidro</span></div>
    <footer>
      <b>S</b> abre/fecha · <b>clique</b> alimenta os peixes
    </footer>
  </div>
<script>
/* Aquário — wallpaper animado.
   Tudo é desenhado por código no <canvas>: nenhum asset externo, funciona offline. */
(() => {
  'use strict';

  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const angLerp = (a, b, t) => a + Math.atan2(Math.sin(b - a), Math.cos(b - a)) * t;

  // ---------------------------------------------------------------- cenários

  const THEMES = {
    reef:   { top: '#1a6f9c', mid: '#0d4468', bottom: '#062637', wall: '#0a3550', ray: '#9fe8ff', gravel: ['#4a4b52', '#6b6a63', '#3b4149', '#7a7264'], haze: '#0e4a6e' },
    deep:   { top: '#0d4a5c', mid: '#062c3c', bottom: '#02151f', wall: '#052430', ray: '#7fdcd0', gravel: ['#33383c', '#4a4b47', '#282e33', '#565049'], haze: '#073442' },
    lagoon: { top: '#2fa3b8', mid: '#12708f', bottom: '#084257', wall: '#0f5b78', ray: '#c9fbff', gravel: ['#8a8271', '#a89b83', '#6d6a5e', '#b5aa90'], haze: '#12758f' },
  };

  const CFG = {
    fishCount: 14,
    speed: 1,
    light: 1,
    bubbles: true,
    plants: true,
    glass: true,
    theme: 'reef',
  };

  // ?fishCount=20&theme=lagoon&speed=0.6 ...
  new URLSearchParams(location.search).forEach((raw, key) => {
    if (!(key in CFG)) return;
    const cur = CFG[key];
    if (typeof cur === 'number') { const n = parseFloat(raw); if (!isNaN(n)) CFG[key] = n; }
    else if (typeof cur === 'boolean') CFG[key] = raw !== '0' && raw !== 'false';
    else CFG[key] = raw;
  });

  // ---------------------------------------------------------------- espécies

  const SPECIES = [
    { name: 'palhaco',  len: 78,  ratio: 0.52, back: '#ff8a1e', belly: '#ffd08a', fin: '#ffb257', edge: '#1d1208', bands: 3, bandColor: '#fdf6ec', tall: 1.0,  tail: 1.0 },
    { name: 'cirurgiao', len: 92, ratio: 0.60, back: '#1f6fd8', belly: '#4ea6f5', fin: '#f7d13c', edge: '#0a1a33', bands: 0, bandColor: '#0d1c30', tall: 1.1,  tail: 1.05 },
    { name: 'amarelo',  len: 70,  ratio: 0.62, back: '#ffd21f', belly: '#ffe98a', fin: '#ffc400', edge: '#4a3600', bands: 0, bandColor: '#ffffff', tall: 1.20, tail: 0.95 },
    { name: 'anjo',     len: 86,  ratio: 0.70, back: '#e9e4d6', belly: '#fbf8f0', fin: '#f0c96b', edge: '#2b2417', bands: 4, bandColor: '#2b2417', tall: 1.20, tail: 1.25 },
    { name: 'cardeal',  len: 46,  ratio: 0.45, back: '#e0453f', belly: '#f5b3a4', fin: '#f7ece3', edge: '#3a0f0d', bands: 1, bandColor: '#2a2a2a', tall: 0.95, tail: 0.9 },
    { name: 'guppy',    len: 42,  ratio: 0.40, back: '#7a5cf0', belly: '#bfa8ff', fin: '#ff7ad9', edge: '#2a1550', bands: 0, bandColor: '#ffffff', tall: 0.9,  tail: 1.6 },
    { name: 'neon',     len: 38,  ratio: 0.38, back: '#22c7d6', belly: '#dff7fb', fin: '#8fe9f2', edge: '#0b3a40', bands: 1, bandColor: '#e8455a', tall: 0.85, tail: 0.85 },
    { name: 'borboleta',len: 74,  ratio: 0.64, back: '#f6c342', belly: '#fdf0c4', fin: '#f0a92b', edge: '#3a2d05', bands: 5, bandColor: '#c98a12', tall: 1.15, tail: 1.0 },
  ];

  // ---------------------------------------------------------------- canvas

  const canvas = document.getElementById('tank');
  const ctx = canvas.getContext('2d', { alpha: false });

  let W = 0, H = 0, DPR = 1, FLOOR = 0;
  let theme = THEMES[CFG.theme] || THEMES.reef;

  let backdrop = null;   // parede do fundo + plantas distantes (pré-renderizado)
  let gravelCv = null;   // cascalho + pedras (pré-renderizado)
  let plants = [];
  let anemones = [];
  const fish = [];
  const bubbles = [];
  const flakes = [];
  const dust = [];
  const ripples = [];
  let lure = null;      // ponto tocado: atrai os peixes por alguns segundos
  let pointerHeld = false;

  // ---------------------------------------------------------------- cenário

  function offscreen(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, w | 0);
    c.height = Math.max(1, h | 0);
    return c;
  }

  function buildGravel() {
    const h = Math.round(H - FLOOR) + 4;
    const c = offscreen(W, h);
    const g = c.getContext('2d');

    const base = g.createLinearGradient(0, 0, 0, h);
    base.addColorStop(0, theme.gravel[2]);
    base.addColorStop(1, '#14161a');
    g.fillStyle = base;
    g.fillRect(0, 0, W, h);

    // duna suave no topo do cascalho
    g.beginPath();
    g.moveTo(0, h);
    g.lineTo(0, 14);
    for (let x = 0; x <= W; x += 12) {
      g.lineTo(x, 18 + Math.sin(x * 0.004) * 13 + Math.sin(x * 0.017 + 1.7) * 5 + Math.sin(x * 0.043 + 4.1) * 2);
    }
    g.lineTo(W, h);
    g.closePath();
    g.fillStyle = theme.gravel[1];
    g.fill();

    // pedras maiores, semienterradas e iluminadas por cima
    for (let i = 0; i < 5; i++) {
      const x = rand(W * 0.05, W * 0.95);
      const rw = rand(40, 110);
      const rh = rw * rand(0.34, 0.5);
      const y = rand(42, 74);
      g.save();
      g.translate(x, y);
      g.rotate(rand(-0.12, 0.12));
      g.beginPath();
      g.ellipse(0, 0, rw, rh, 0, 0, TAU);
      const shade = g.createLinearGradient(0, -rh, 0, rh * 0.9);
      shade.addColorStop(0, '#9a9285');
      shade.addColorStop(0.35, '#6d675d');
      shade.addColorStop(0.75, '#3d3a35');
      shade.addColorStop(1, '#1c1e21');
      g.fillStyle = shade;
      g.fill();
      // realce no topo
      g.beginPath();
      g.ellipse(-rw * 0.15, -rh * 0.35, rw * 0.55, rh * 0.3, -0.2, 0, TAU);
      g.fillStyle = 'rgba(255,255,255,.10)';
      g.fill();
      g.restore();
    }

    const count = Math.round((W * h) / 620);
    for (let i = 0; i < count; i++) {
      const x = Math.random() * W;
      const depth = Math.pow(Math.random(), 0.6);
      const y = 10 + depth * (h - 10);
      const r = rand(2.2, 6.5) * (0.55 + depth * 0.75);
      g.save();
      g.translate(x, y);
      g.rotate(rand(0, TAU));
      g.beginPath();
      g.ellipse(0, 0, r, r * rand(0.62, 0.92), 0, 0, TAU);
      const shade = g.createLinearGradient(-r, -r, r, r);
      const col = pick(theme.gravel);
      shade.addColorStop(0, col);
      shade.addColorStop(1, '#0d1013');
      g.fillStyle = shade;
      g.globalAlpha = 0.55 + depth * 0.45;
      g.fill();
      g.restore();
    }

    // penumbra na juncao agua/cascalho
    const contact = g.createLinearGradient(0, 0, 0, 24);
    contact.addColorStop(0, 'rgba(0,10,18,.42)');
    contact.addColorStop(1, 'rgba(0,10,18,0)');
    g.fillStyle = contact;
    g.fillRect(0, 0, W, 24);

    gravelCv = c;
  }

  function bladePath(g, x, baseY, h, w, bend, curl, phase) {
    const SEG = 10;
    const left = [], right = [];
    for (let i = 0; i <= SEG; i++) {
      const u = i / SEG;
      const px = x + bend * u * u + Math.sin(u * 2.6 + phase) * curl * u;
      const py = baseY - u * h;
      const half = w * (1 - u) * (0.35 + 0.65 * Math.sin(Math.PI * Math.min(1, u * 1.15 + 0.08)));
      left.push([px - half, py]);
      right.push([px + half, py]);
    }
    g.beginPath();
    g.moveTo(left[0][0], left[0][1]);
    for (const p of left) g.lineTo(p[0], p[1]);
    for (let i = right.length - 1; i >= 0; i--) g.lineTo(right[i][0], right[i][1]);
    g.closePath();
  }

  function makePlant(x, scale, palette, depth = Math.random()) {
    const blades = [];
    const n = 3 + ((Math.random() * 5) | 0);
    for (let i = 0; i < n; i++) {
      blades.push({
        dx: rand(-26, 26) * scale,
        h: rand(H * 0.16, H * 0.40) * scale,
        w: rand(7, 15) * scale,
        curl: rand(-22, 22) * scale,
        amp: rand(10, 30) * scale,
        phase: rand(0, TAU),
        speed: rand(0.5, 0.95),
        color: pick(palette),
      });
    }
    return { x, blades, depth };
  }

  function drawPlant(g, p, t, alpha) {
    for (const b of p.blades) {
      const bend = Math.sin(t * b.speed + b.phase) * b.amp;
      bladePath(g, p.x + b.dx, FLOOR + 6, b.h, b.w, bend, b.curl, b.phase);
      const grad = g.createLinearGradient(p.x + b.dx, FLOOR, p.x + b.dx, FLOOR - b.h);
      grad.addColorStop(0, '#0c2417');
      grad.addColorStop(1, b.color);
      g.globalAlpha = alpha;
      g.fillStyle = grad;
      g.fill();
    }
    g.globalAlpha = 1;
  }

  function drawAnemone(g, a, t) {
    g.save();
    g.translate(a.x, FLOOR + 4);
    for (let i = 0; i < a.n; i++) {
      const u = i / (a.n - 1);
      const bx = (u - 0.5) * a.r * 2;
      const sway = Math.sin(t * 1.5 + i * 0.7 + a.phase) * a.r * 0.35;
      g.beginPath();
      g.moveTo(bx, 0);
      g.quadraticCurveTo(bx + sway * 0.5, -a.h * 0.55, bx + sway, -a.h * (0.7 + 0.3 * Math.sin(i * 2.1)));
      g.strokeStyle = a.color;
      g.globalAlpha = 0.85;
      g.lineWidth = a.w;
      g.lineCap = 'round';
      g.stroke();
    }
    g.globalAlpha = 1;
    g.beginPath();
    g.ellipse(0, 0, a.r * 1.1, a.r * 0.5, 0, 0, TAU);
    g.fillStyle = a.base;
    g.fill();
    g.restore();
  }

  function buildBackdrop() {
    const c = offscreen(W, H);
    const g = c.getContext('2d');

    const water = g.createLinearGradient(0, 0, 0, H);
    water.addColorStop(0, theme.top);
    water.addColorStop(0.55, theme.mid);
    water.addColorStop(1, theme.bottom);
    g.fillStyle = water;
    g.fillRect(0, 0, W, H);

    // parede do fundo do tanque
    const wall = g.createRadialGradient(W * 0.5, H * 0.35, 0, W * 0.5, H * 0.35, Math.max(W, H) * 0.75);
    wall.addColorStop(0, theme.wall);
    wall.addColorStop(1, 'rgba(0,0,0,0)');
    g.globalAlpha = 0.6;
    g.fillStyle = wall;
    g.fillRect(0, 0, W, H);
    g.globalAlpha = 1;

    // silhuetas distantes e desfocadas
    if (CFG.plants) {
      g.filter = 'blur(7px)';
      const far = ['#0b3a2c', '#0d4434', '#08302a', '#123f2f'];
      for (let i = 0; i < 9; i++) {
        const p = makePlant(rand(-40, W + 40), rand(0.5, 0.85), far);
        drawPlant(g, p, 0, 0.5);
      }
      g.filter = 'none';
      g.globalAlpha = 1;
    }

    backdrop = c;
  }

  function buildScene() {
    FLOOR = Math.round(H * 0.84);
    theme = THEMES[CFG.theme] || THEMES.reef;

    buildGravel();
    buildBackdrop();

    plants = [];
    const greens = ['#1f7a45', '#2a9455', '#177a5e', '#3aa860', '#6d8f2a', '#8b4a6b'];
    const n = Math.max(5, Math.round(W / 230));
    for (let i = 0; i < n; i++) {
      const depth = Math.random();
      plants.push(makePlant(rand(-30, W + 30), lerp(0.68, 1.35, depth), greens, depth));
    }
    plants.sort((a, b) => a.depth - b.depth);

    anemones = [];
    for (let i = 0; i < 2; i++) {
      anemones.push({
        x: rand(W * 0.12, W * 0.88),
        n: 16, r: rand(16, 26), h: rand(38, 62), w: rand(3, 5),
        phase: rand(0, TAU),
        color: pick(['#d9738f', '#c95f52', '#8f6fd0']),
        base: '#5d3a4a',
      });
    }

    dust.length = 0;
    const dustCount = Math.round((W * H) / 26000);
    for (let i = 0; i < dustCount; i++) {
      dust.push({ x: Math.random() * W, y: Math.random() * H, r: rand(0.6, 1.9), vy: rand(-5, -1), vx: rand(-4, 4), a: rand(0.06, 0.22) });
    }

    syncFishCount();
    for (const f of fish) f.clampToTank();
  }

  // ---------------------------------------------------------------- peixes

  class Fish {
    constructor() {
      this.sp = pick(SPECIES);
      this.depth = Math.random();
      this.x = rand(0, W);
      this.y = rand(H * 0.10, FLOOR - 20);
      this.angle = rand(0, TAU);
      this.phase = rand(0, TAU);
      this.baseSpeed = rand(26, 52) * lerp(1.25, 0.75, this.depth);
      this.speed = this.baseSpeed;
      this.turn = rand(1.1, 2.0);
      this.hunger = 0;
      // cada peixe se posiciona num ponto proprio ao redor do toque,
      // senao todos empilham no mesmo pixel
      this.lureAng = rand(0, TAU);
      this.lureDist = rand(18, 95);
      this.pickTarget();
      this.scale = lerp(0.45, 1.15, this.depth) * (Math.min(W, H) / 900 + 0.55);
    }

    pickTarget() {
      this.tx = rand(W * 0.04, W * 0.96);
      this.ty = rand(H * 0.08, FLOOR - 26);
      this.wait = rand(1.5, 5);
    }

    clampToTank() {
      this.x = clamp(this.x, 10, W - 10);
      this.y = clamp(this.y, H * 0.06, FLOOR - 14);
      this.scale = lerp(0.45, 1.15, this.depth) * (Math.min(W, H) / 900 + 0.55);
    }

    update(dt, t) {
      // comida tem prioridade
      let goal = null, best = 1e9;
      for (const fl of flakes) {
        const d = (fl.x - this.x) ** 2 + (fl.y - this.y) ** 2;
        if (d < best && d < 460 * 460) { best = d; goal = fl; }
      }

      if (goal) {
        this.tx = goal.x; this.ty = goal.y;
        this.speed = lerp(this.speed, this.baseSpeed * 2.6, dt * 3);
        if (best < 18 * 18) { goal.eaten = true; this.hunger = 0; }
      } else if (lure && (lure.x - this.x) ** 2 + (lure.y - this.y) ** 2 < 760 * 760) {
        // nada em direcao ao dedo/cursor, parando a uma distancia curta
        const ox = lure.x + Math.cos(this.lureAng) * this.lureDist;
        const oy = lure.y + Math.sin(this.lureAng) * this.lureDist * 0.7;
        const d = Math.hypot(ox - this.x, oy - this.y);
        const stop = 14 + this.scale * 18;
        this.tx = ox; this.ty = oy;
        this.speed = lerp(this.speed, this.baseSpeed * (d > stop ? 2.1 : 0.35), dt * 3);
        this.wait = rand(0.4, 1.2);
      } else {
        this.speed = lerp(this.speed, this.baseSpeed, dt * 1.6);
        this.wait -= dt;
        const near = (this.tx - this.x) ** 2 + (this.ty - this.y) ** 2 < 60 * 60;
        if (near || this.wait <= 0) this.pickTarget();
      }

      // desvia das bordas
      const margin = 90;
      let ax = this.tx, ay = this.ty;
      if (this.x < margin) ax += (margin - this.x) * 2;
      if (this.x > W - margin) ax -= (this.x - (W - margin)) * 2;
      if (this.y < margin * 0.7) ay += (margin * 0.7 - this.y) * 2;
      if (this.y > FLOOR - margin * 0.5) ay -= (this.y - (FLOOR - margin * 0.5)) * 2;

      const want = Math.atan2(ay - this.y, ax - this.x);
      this.angle = angLerp(this.angle, want, clamp(this.turn * dt, 0, 1));

      const v = this.speed * CFG.speed;
      this.x += Math.cos(this.angle) * v * dt;
      this.y += Math.sin(this.angle) * v * dt + Math.sin(t * 1.7 + this.phase) * 6 * dt;
      this.phase += dt * (5.2 + v * 0.05);

      this.x = clamp(this.x, -60, W + 60);
      this.y = clamp(this.y, H * 0.04, FLOOR - 10);
    }

    draw(g) {
      const sp = this.sp;
      const L = sp.len * this.scale;
      const Hh = L * sp.ratio * sp.tall;
      const swim = Math.sin(this.phase) * (0.55 + this.speed / this.baseSpeed * 0.45);

      g.save();
      g.translate(this.x, this.y);
      g.rotate(this.angle);
      if (Math.cos(this.angle) < 0) g.scale(1, -1);

      const SEG = 12;
      const top = [], bot = [], spine = [];
      for (let i = 0; i <= SEG; i++) {
        const u = i / SEG;                    // 0 = cauda, 1 = focinho
        const x = -L / 2 + u * L;
        const y = swim * Hh * 0.30 * Math.pow(1 - u, 1.5) * Math.cos(u * 2.4);
        const half = (Hh / 2) * Math.pow(Math.sin(Math.PI * Math.pow(clamp(u, 0, 1), 0.78)), 0.72);
        spine.push([x, y]);
        top.push([x, y - half]);
        bot.push([x, y + half]);
      }

      // ancora a caudal um pouco dentro do corpo para nao "descolar"
      const tailRoot = spine[1];
      const tailLen = L * 0.30 * sp.tail;
      const tailSpread = L * 0.24 * sp.tail;
      const tailRootW = Hh * 0.14;
      const tailKick = swim * L * 0.20;

      // nadadeira caudal
      g.beginPath();
      g.moveTo(tailRoot[0], tailRoot[1] - tailRootW);
      g.quadraticCurveTo(tailRoot[0] - tailLen * 0.5, tailRoot[1] + tailKick * 0.5,
                         tailRoot[0] - tailLen, tailRoot[1] + tailKick - tailSpread);
      g.quadraticCurveTo(tailRoot[0] - tailLen * 0.55, tailRoot[1] + tailKick,
                         tailRoot[0] - tailLen, tailRoot[1] + tailKick + tailSpread);
      g.lineTo(tailRoot[0], tailRoot[1] + tailRootW);
      g.closePath();
      g.fillStyle = sp.fin;
      g.globalAlpha = 0.92;
      g.fill();
      g.globalAlpha = 1;

      // nadadeira dorsal
      const d0 = top[(SEG * 0.35) | 0], d1 = top[(SEG * 0.72) | 0];
      g.beginPath();
      g.moveTo(d0[0], d0[1]);
      g.quadraticCurveTo((d0[0] + d1[0]) / 2, d0[1] - L * 0.20, d1[0], d1[1]);
      g.closePath();
      g.fillStyle = sp.fin;
      g.globalAlpha = 0.85;
      g.fill();

      // nadadeira ventral
      const v0 = bot[(SEG * 0.42) | 0], v1 = bot[(SEG * 0.66) | 0];
      g.beginPath();
      g.moveTo(v0[0], v0[1]);
      g.quadraticCurveTo((v0[0] + v1[0]) / 2, v0[1] + L * 0.13, v1[0], v1[1]);
      g.closePath();
      g.fill();
      g.globalAlpha = 1;

      // corpo
      g.beginPath();
      g.moveTo(top[0][0], top[0][1]);
      for (const p of top) g.lineTo(p[0], p[1]);
      for (let i = bot.length - 1; i >= 0; i--) g.lineTo(bot[i][0], bot[i][1]);
      g.closePath();

      const body = g.createLinearGradient(0, -Hh / 2, 0, Hh / 2);
      body.addColorStop(0, sp.back);
      body.addColorStop(0.55, sp.back);
      body.addColorStop(1, sp.belly);
      g.fillStyle = body;
      g.fill();

      // faixas
      if (sp.bands > 0) {
        g.save();
        g.clip();
        g.strokeStyle = sp.bandColor;
        g.lineWidth = Math.min(Hh * 0.16, L * 0.11);
        g.globalAlpha = 0.9;
        for (let b = 0; b < sp.bands; b++) {
          const u = 0.24 + (b + 0.5) / sp.bands * 0.6;
          const i = clamp(Math.round(u * SEG), 0, SEG);
          g.beginPath();
          g.moveTo(top[i][0] + Hh * 0.10, top[i][1] - 2);
          g.lineTo(bot[i][0] - Hh * 0.10, bot[i][1] + 2);
          g.stroke();
        }
        g.restore();
      }

      // brilho no dorso
      g.save();
      g.beginPath();
      g.moveTo(top[0][0], top[0][1]);
      for (const p of top) g.lineTo(p[0], p[1]);
      for (let i = bot.length - 1; i >= 0; i--) g.lineTo(bot[i][0], bot[i][1]);
      g.closePath();
      g.clip();
      const gloss = g.createLinearGradient(0, -Hh / 2, 0, 0);
      gloss.addColorStop(0, 'rgba(255,255,255,.38)');
      gloss.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gloss;
      g.fillRect(-L, -Hh, L * 2, Hh);
      g.restore();

      // contorno
      g.beginPath();
      g.moveTo(top[0][0], top[0][1]);
      for (const p of top) g.lineTo(p[0], p[1]);
      for (let i = bot.length - 1; i >= 0; i--) g.lineTo(bot[i][0], bot[i][1]);
      g.closePath();
      g.strokeStyle = sp.edge;
      g.globalAlpha = 0.5;
      g.lineWidth = Math.max(0.8, L * 0.012);
      g.stroke();
      g.globalAlpha = 1;

      // peitoral batendo
      const px = L * 0.16, py = Hh * 0.16;
      g.save();
      g.translate(px, py);
      g.rotate(Math.sin(this.phase * 1.6) * 0.4 + 0.5);
      g.beginPath();
      g.ellipse(-L * 0.05, 0, L * 0.085, L * 0.032, 0, 0, TAU);
      g.fillStyle = sp.fin;
      g.globalAlpha = 0.42;
      g.fill();
      g.strokeStyle = sp.edge;
      g.globalAlpha = 0.2;
      g.lineWidth = Math.max(0.5, L * 0.008);
      g.stroke();
      g.restore();
      g.globalAlpha = 1;

      // olho
      const er = Math.max(1.1, Math.min(L * 0.052, Hh * 0.16));
      const ex = L * 0.33, ey = -Hh * 0.12;
      g.beginPath();
      g.arc(ex, ey, er, 0, TAU);
      g.fillStyle = '#fbfbf7';
      g.fill();
      g.beginPath();
      g.arc(ex + er * 0.22, ey, er * 0.55, 0, TAU);
      g.fillStyle = '#10151a';
      g.fill();
      g.beginPath();
      g.arc(ex - er * 0.25, ey - er * 0.3, er * 0.22, 0, TAU);
      g.fillStyle = 'rgba(255,255,255,.9)';
      g.fill();

      g.restore();
    }
  }

  function syncFishCount() {
    const want = Math.round(clamp(CFG.fishCount, 1, 40));
    while (fish.length > want) fish.pop();
    while (fish.length < want) fish.push(new Fish());
  }

  // ---------------------------------------------------------------- partículas

  function spawnBubble(x, y, r) {
    bubbles.push({ x, y, r, vy: -rand(28, 62) * (r / 5), phase: rand(0, TAU), wob: rand(6, 20) });
  }

  function updateBubbles(dt, t) {
    if (CFG.bubbles) {
      bubbleAcc += dt;
      const rate = 0.055;
      while (bubbleAcc > rate) {
        bubbleAcc -= rate;
        spawnBubble(bubblerX + rand(-9, 9), FLOOR - rand(0, 6), rand(2, 6.5));
      }
      if (Math.random() < dt * 1.2) spawnBubble(rand(0, W), FLOOR - rand(0, 30), rand(1.2, 3));
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.y += b.vy * dt;
      b.x += Math.sin(t * 2.2 + b.phase) * b.wob * dt;
      if (b.y < -20) bubbles.splice(i, 1);
    }
  }

  function drawBubbler(g) {
    const w = 34, h = 13;
    g.save();
    g.translate(bubblerX, FLOOR + 2);
    g.beginPath();
    g.moveTo(-w / 2, 0);
    g.lineTo(w / 2, 0);
    g.lineTo(w / 2 - 3, -h);
    g.lineTo(-w / 2 + 3, -h);
    g.closePath();
    const grad = g.createLinearGradient(0, -h, 0, 0);
    grad.addColorStop(0, '#6d6f74');
    grad.addColorStop(1, '#2a2d31');
    g.fillStyle = grad;
    g.fill();
    g.restore();
  }

  function drawBubbles(g) {
    for (const b of bubbles) {
      g.beginPath();
      g.arc(b.x, b.y, b.r, 0, TAU);
      g.strokeStyle = 'rgba(220,245,255,.55)';
      g.lineWidth = Math.max(0.6, b.r * 0.22);
      g.stroke();
      g.beginPath();
      g.arc(b.x - b.r * 0.3, b.y - b.r * 0.32, b.r * 0.34, 0, TAU);
      g.fillStyle = 'rgba(255,255,255,.6)';
      g.fill();
    }
  }

  function updateFlakes(dt, t) {
    for (let i = flakes.length - 1; i >= 0; i--) {
      const f = flakes[i];
      f.life -= dt;
      f.y += f.vy * dt;
      f.x += Math.sin(t * 1.3 + f.phase) * 9 * dt;
      f.rot += dt * f.spin;
      if (f.eaten || f.life <= 0 || f.y > FLOOR - 4) flakes.splice(i, 1);
    }
  }

  function drawFlakes(g) {
    for (const f of flakes) {
      g.save();
      g.translate(f.x, f.y);
      g.rotate(f.rot);
      g.fillStyle = f.color;
      g.globalAlpha = clamp(f.life / 3, 0, 1);
      g.fillRect(-f.s / 2, -f.s / 4, f.s, f.s * 0.5);
      g.restore();
    }
    g.globalAlpha = 1;
  }

  function feed(x, y) {
    for (let i = 0; i < 14; i++) {
      flakes.push({
        x: x + rand(-26, 26), y: y + rand(-18, 18),
        vy: rand(9, 22), phase: rand(0, TAU),
        rot: rand(0, TAU), spin: rand(-2, 2),
        s: rand(3, 6), life: rand(14, 22),
        color: pick(['#d9a441', '#c98b2f', '#e8c46a']),
        eaten: false,
      });
    }
  }

  function updateLure(dt) {
    if (lure) {
      if (!pointerHeld) lure.life -= dt;
      if (lure.life <= 0) lure = null;
    }
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.life -= dt;
      r.r += r.speed * dt;
      if (r.life <= 0) ripples.splice(i, 1);
    }
  }

  function drawRipples(g) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (const r of ripples) {
      const a = clamp(r.life / r.max, 0, 1);
      g.beginPath();
      g.arc(r.x, r.y, r.r, 0, TAU);
      g.strokeStyle = 'rgba(200,240,255,' + (a * 0.35).toFixed(3) + ')';
      g.lineWidth = 1 + a * 2;
      g.stroke();
    }
    g.restore();
  }

  function touchTank(x, y) {
    feed(x, y);
    lure = { x, y, life: 4 };
    ripples.push({ x, y, r: 6, speed: 150, life: 0.9, max: 0.9 });
    ripples.push({ x, y, r: 2, speed: 95, life: 1.3, max: 1.3 });
  }

  function updateDust(dt, t) {
    for (const d of dust) {
      d.y += d.vy * dt;
      d.x += (d.vx + Math.sin(t * 0.6 + d.y * 0.01) * 6) * dt;
      if (d.y < -10) { d.y = H + 10; d.x = Math.random() * W; }
      if (d.x < -10) d.x = W + 10;
      if (d.x > W + 10) d.x = -10;
    }
  }

  function drawDust(g) {
    g.fillStyle = '#dff3ff';
    for (const d of dust) {
      g.globalAlpha = d.a;
      g.beginPath();
      g.arc(d.x, d.y, d.r, 0, TAU);
      g.fill();
    }
    g.globalAlpha = 1;
  }

  // ---------------------------------------------------------------- luz e vidro

  function drawRays(g, t, strength) {
    if (strength <= 0) return;
    g.save();
    g.globalCompositeOperation = 'lighter';
    const ox = W * 0.32, oy = -H * 0.45;
    for (let i = 0; i < 7; i++) {
      const a = -1.28 + i * 0.16 + Math.sin(t * 0.24 + i) * 0.035;
      const wide = (26 + i * 9) * (1 + Math.sin(t * 0.4 + i * 1.7) * 0.14);
      const len = H * 2.1;
      g.save();
      g.translate(ox, oy);
      g.rotate(a + Math.PI / 2);
      const grad = g.createLinearGradient(0, 0, 0, len);
      grad.addColorStop(0, theme.ray);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      g.globalAlpha = (0.055 + 0.03 * Math.sin(t * 0.6 + i)) * strength;
      g.fillStyle = grad;
      g.beginPath();
      g.moveTo(-wide * 0.25, 0);
      g.lineTo(wide * 0.25, 0);
      g.lineTo(wide, len);
      g.lineTo(-wide, len);
      g.closePath();
      g.fill();
      g.restore();
    }
    g.restore();
  }

  function drawCaustics(g, t, strength) {
    if (strength <= 0) return;
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 9; i++) {
      const x = ((i / 9) * W + Math.sin(t * 0.35 + i * 1.3) * W * 0.06 + W) % W;
      const w = W * 0.10 + Math.sin(t * 0.7 + i) * W * 0.02;
      const grad = g.createRadialGradient(x, FLOOR + 6, 0, x, FLOOR + 6, w);
      grad.addColorStop(0, theme.ray);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      g.globalAlpha = (0.05 + 0.03 * Math.sin(t * 1.1 + i * 2.1)) * strength;
      g.fillStyle = grad;
      g.fillRect(x - w, FLOOR - w * 0.5, w * 2, w);
    }
    g.restore();
  }

  function drawGlass(g, t) {
    // vinheta
    const vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.max(W, H) * 0.72);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,8,14,.62)');
    g.fillStyle = vig;
    g.fillRect(0, 0, W, H);

    if (!CFG.glass) return;

    // reflexos diagonais no vidro
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = 0.05;
    g.translate(W * 0.72, 0);
    g.rotate(0.32);
    for (const [off, wid] of [[-90, 46], [40, 22], [110, 60]]) {
      const grad = g.createLinearGradient(off, 0, off + wid, 0);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(0.5, 'rgba(210,240,255,1)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = grad;
      g.fillRect(off, -H, wid, H * 3);
    }
    g.restore();

    // linha d'água no topo
    g.save();
    g.globalCompositeOperation = 'lighter';
    const surf = g.createLinearGradient(0, 0, 0, H * 0.07);
    surf.addColorStop(0, 'rgba(200,240,255,.30)');
    surf.addColorStop(1, 'rgba(200,240,255,0)');
    g.fillStyle = surf;
    g.fillRect(0, 0, W, H * 0.07);
    g.restore();

    // ondulação sutil da superfície
    g.save();
    g.globalAlpha = 0.14;
    g.strokeStyle = '#cdefff';
    g.lineWidth = 1.4;
    g.beginPath();
    for (let x = 0; x <= W; x += 8) {
      const y = 5 + Math.sin(x * 0.012 + t * 1.1) * 3 + Math.sin(x * 0.031 - t * 0.7) * 2;
      x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.stroke();
    g.restore();
  }

  // ---------------------------------------------------------------- loop

  let bubbleAcc = 0;
  let bubblerX = 0;
  let last = performance.now();
  let clock = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    if (document.hidden) { last = now; return; }

    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;          // evita saltos ao voltar de suspensão
    clock += dt * CFG.speed;
    const t = clock;

    for (const f of fish) f.update(dt, t);
    updateBubbles(dt, t);
    updateFlakes(dt, t);
    updateDust(dt, t);
    updateLure(dt);

    // --- desenho
    ctx.drawImage(backdrop, 0, 0);
    drawRays(ctx, t, CFG.light);

    ctx.drawImage(gravelCv, 0, FLOOR - 2);
    drawCaustics(ctx, t, CFG.light);

    if (CFG.plants) {
      for (const p of plants) if (p.depth < 0.5) drawPlant(ctx, p, t, 0.85);
      for (const a of anemones) drawAnemone(ctx, a, t);
    }

    // peixes ao fundo
    for (const f of fish) if (f.depth < 0.45) f.draw(ctx);

    // névoa de profundidade
    ctx.save();
    const haze = ctx.createLinearGradient(0, 0, 0, H);
    haze.addColorStop(0, theme.haze);
    haze.addColorStop(1, theme.bottom);
    ctx.globalAlpha = 0.20;
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    if (CFG.bubbles) drawBubbler(ctx);

    if (CFG.plants) {
      for (const p of plants) if (p.depth >= 0.5) drawPlant(ctx, p, t, 0.95);
    }

    // peixes à frente
    for (const f of fish) if (f.depth >= 0.45) f.draw(ctx);

    drawRipples(ctx);
    drawFlakes(ctx);
    if (CFG.bubbles) drawBubbles(ctx);
    drawDust(ctx);
    drawRays(ctx, t + 40, CFG.light * 0.45);
    drawGlass(ctx, t);
  }

  // ---------------------------------------------------------------- entrada

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bubblerX = W * 0.86;
    buildScene();
  }

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 180);
  });

  canvas.addEventListener('pointerdown', (e) => {
    pointerHeld = true;
    touchTank(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pointerHeld || !lure) return;
    lure.x = e.clientX;
    lure.y = e.clientY;   // os peixes acompanham o dedo enquanto ele desliza
  });
  const releasePointer = () => { pointerHeld = false; };
  canvas.addEventListener('pointerup', releasePointer);
  canvas.addEventListener('pointercancel', releasePointer);
  window.addEventListener('blur', releasePointer);

  // ---------------------------------------------------------------- painel

  const painel = document.getElementById('painel');
  const outs = {};
  document.querySelectorAll('[data-out]').forEach((el) => { outs[el.dataset.out] = el; });

  function bind(id, apply, fmt) {
    const el = document.getElementById(id);
    if (!el) return;
    const handler = () => {
      const val = el.type === 'checkbox' ? el.checked
        : el.type === 'range' ? parseFloat(el.value)
        : el.value;
      CFG[id] = val;
      if (outs[id]) outs[id].textContent = fmt ? fmt(val) : val;
      if (apply) apply(val);
    };
    el.addEventListener('input', handler);
    // reflete valores vindos da URL
    if (el.type === 'checkbox') el.checked = CFG[id];
    else el.value = CFG[id];
    if (outs[id]) outs[id].textContent = fmt ? fmt(CFG[id]) : CFG[id];
  }

  bind('fishCount', syncFishCount);
  bind('speed', null, (v) => v.toFixed(1));
  bind('light', null, (v) => v.toFixed(1));
  bind('theme', () => buildScene());
  bind('bubbles');
  bind('plants', () => buildScene());
  bind('glass');
  // rótulos de contagem/luz precisam do valor inicial
  if (outs.fishCount) outs.fishCount.textContent = CFG.fishCount;

  window.addEventListener('keydown', (e) => {
    if (e.key === 's' || e.key === 'S') painel.classList.toggle('aberto');
    if (e.key === 'Escape') painel.classList.remove('aberto');
    if (e.key === 'f' || e.key === 'F') touchTank(rand(W * 0.2, W * 0.8), H * 0.15);
  });

  // ------------------------------------------------- integração com wallpapers

  const THEME_KEYS = ['reef', 'deep', 'lagoon'];

  function applyExternal(name, val) {
    if (!(name in CFG)) return;
    // dropdowns externos entregam o indice, nao a chave
    CFG[name] = (name === 'theme' && typeof val === 'number')
      ? (THEME_KEYS[val] || 'reef')
      : val;
    if (name === 'fishCount') syncFishCount();
    if (name === 'theme' || name === 'plants') buildScene();
  }

  // Lively Wallpaper (Windows) — lê LivelyProperties.json
  window.livelyPropertyListener = applyExternal;

  // Wallpaper Engine (Windows)
  window.wallpaperPropertyListener = {
    applyUserProperties(props) {
      for (const k in props) applyExternal(k, props[k].value);
    },
  };

  resize();
  requestAnimationFrame(frame);
})();

</script>
